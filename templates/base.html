<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">

  <meta property="og:type" content="{{ogtype}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/style.css">
  <link rel="alternate" type="application/atom+xml" href="/feed.xml" title="{{sitetitle}}">

  <!-- Set the theme before first paint so the page never flashes the wrong colours -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        if (saved === "dark" || saved === "light") {
          document.documentElement.setAttribute("data-theme", saved);
        }
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <header class="site-header">
    <div class="wrap">
      <a class="site-title" href="/">{{sitetitle}}</a>
      <nav class="site-nav">
        {{nav}}
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch between light and dark">
          <span aria-hidden="true" id="theme-icon">◐</span>
        </button>
      </nav>
    </div>
  </header>

  <main>
    <div class="wrap">
{{content}}
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>&copy; {{year}} {{sitetitle}} &middot; <a href="https://linkedin.com/in/jillmetcalfe">LinkedIn</a> &middot; <a href="/feed.xml">RSS</a></p>
      <p>Written in Notion. Built with a small script. Hosted on GitHub Pages.</p>
    </div>
  </footer>

  <script>
    (function () {
      var btn = document.getElementById("theme-toggle");
      if (!btn) return;
      btn.addEventListener("click", function () {
        var root = document.documentElement;
        var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var current = root.getAttribute("data-theme") || (systemDark ? "dark" : "light");
        var next = current === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("theme", next); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
