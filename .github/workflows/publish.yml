name: Publish

# Four ways this runs:
#   1. Every 30 minutes, to pick up anything you marked "Ready to publish" in Notion
#   2. Whenever you push a change to the code or the styling
#   3. Manually, from the Actions tab, when you don't want to wait
#   4. Instantly, when Notion pings the "website-publish" worker (repository_dispatch)
#
# DO NOT DELETE THE 30-MINUTE SCHEDULE, even though (4) makes publishing feel instant.
# They do different jobs. Scheduled posts — pages marked "Ready to publish" with a
# future Date — are held back by the date filter in sync.js. The Notion automation
# fires once, at the moment the status changes, when the post is still correctly held
# back. Nothing fires again. Only this schedule comes back later and publishes it when
# its date arrives. Remove the schedule and scheduled posts never go out.
#
# Pushes to any branch will build the site, so you can check a change is sound.
# Only main ever talks to Notion or puts anything live — see the guards below.
on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: ["**"]
  workflow_dispatch:
  repository_dispatch:
    types: [notion-publish]

# If two runs overlap, let the newer one finish rather than queueing up.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Fetch from Notion, then turn content/ into a finished site.
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # so the sync can commit new markdown back to the repo

    steps:
      - name: Get the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only on main. Running this from a branch would mark pages as "Published"
      # in Notion while the content went nowhere, which is a mess to undo by hand.
      #
      # continue-on-error: if Notion is unreachable or the token has expired, say so
      # loudly but carry on. The site should still deploy from the content already
      # committed — a publishing problem must never take the live site down.
      - name: Pull new content from Notion
        id: sync
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: node sync.js

      - name: Warn if the Notion sync failed
        if: steps.sync.outcome == 'failure'
        run: echo "::warning::Notion sync failed - deploying existing content. The API key may have expired; regenerate it at notion.so/my-integrations."

      - name: Save any new content back to the repo
        if: github.ref == 'refs/heads/main' && steps.sync.outcome == 'success'
        run: |
          git config user.name "notion-sync[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/
          if git diff --cached --quiet; then
            echo "No new content from Notion."
          else
            git commit -m "Sync content from Notion"
            git pull --rebase
            git push
          fi

      - name: Build the site
        run: node build.js

      - name: Check every internal link resolves
        run: node check-links.js

      - name: Package it up
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # ---------------------------------------------------------------------------
  # Put it live. Only ever from main.
  # ---------------------------------------------------------------------------
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Put it live
        id: deploy
        uses: actions/deploy-pages@v4
