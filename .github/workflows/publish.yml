name: Publish

# Three ways this runs:
#   1. Every 30 minutes, to pick up anything you marked "Ready to publish" in Notion
#   2. Whenever you push a change to the code or the styling
#   3. Manually, from the Actions tab, when you don't want to wait
on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [notion-publish]

permissions:
  contents: write   # so the sync can commit new markdown back to the repo
  pages: write      # so we can publish the built site
  id-token: write

# If two runs overlap, let the newer one win rather than queueing up.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Get the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # If Notion is unreachable or the token has expired, say so loudly but carry on.
      # The site should still build and deploy from the content already committed —
      # a publishing problem must never take the live site down.
      - name: Pull new content from Notion
        id: sync
        continue-on-error: true
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: node sync.js

      - name: Warn if the Notion sync failed
        if: steps.sync.outcome == 'failure'
        run: echo "::warning::Notion sync failed - deploying existing content. The API key may have expired; regenerate it at notion.so/my-integrations."

      - name: Save any new content back to the repo
        if: steps.sync.outcome == 'success'
        run: |
          git config user.name "notion-sync[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/
          if git diff --cached --quiet; then
            echo "No new content from Notion."
          else
            git commit -m "Sync content from Notion"
            git pull --rebase
            git push
          fi

      - name: Build the site
        run: node build.js

      - name: Package it up
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Put it live
        id: deploy
        uses: actions/deploy-pages@v4
