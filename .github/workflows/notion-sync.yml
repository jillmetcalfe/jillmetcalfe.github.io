name: Notion Sync

on:
  # Triggered by Notion webhook
  repository_dispatch:
    types: [notion-publish]

  # Runs every 30 minutes to catch scheduled posts
  schedule:
    - cron: "*/30 * * * *"

  # Manual trigger from GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: cd scripts && npm ci

      - name: Run Notion sync
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: node scripts/notion-sync.js

      - name: Commit and push if changed
        run: |
          git config user.name "notion-sync[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts/ _books/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Sync posts from Notion"
            git pull --rebase
            git push
          fi
